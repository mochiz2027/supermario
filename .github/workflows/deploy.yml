name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev
        env:
          NODE_ENV: development

      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc 2>&1 | tee tsc.log
          npx vite build 2>&1 | tee vite.log
        env:
          NODE_ENV: production

      - name: Report Failure Log
        if: steps.build_step.outcome != 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B debug-log
          echo "=== TSC LOG ===" > ci_failure.txt
          cat tsc.log >> ci_failure.txt 2>/dev/null || true
          echo "" >> ci_failure.txt
          echo "=== VITE LOG ===" >> ci_failure.txt
          cat vite.log >> ci_failure.txt 2>/dev/null || true
          git add -f ci_failure.txt
          git commit -m "ci build failure log [skip ci]"
          git push -f origin debug-log
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4